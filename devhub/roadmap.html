<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Private roadmap — TTVM Studios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../acct.css?v=9">
<meta name="robots" content="noindex,nofollow">
<style>
.rm-key{max-width:520px}
.rm-key input{width:100%;margin:10px 0 6px}
.rm-err{color:#ff6b5e;min-height:1.2em;font-size:.86rem}
.rm-meta{color:var(--ac-dim,#9a9ba8);font-size:.86rem;margin:-6px 0 18px}
.rm-sec{margin-top:18px}
.rm-sec h2{display:flex;align-items:center;gap:10px}
.rm-sec h2 small{font-size:.8rem;color:var(--ac-dim,#9a9ba8);font-weight:500;letter-spacing:.06em}
.rm-list{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.rm-list li{padding:10px 12px;border:1px solid var(--ac-line,#262a33);border-radius:10px;background:rgba(255,255,255,.02)}
.rm-list li b{color:#fff;font-weight:600}
.rm-list li span{display:block;color:var(--ac-dim,#9a9ba8);font-size:.86rem;margin-top:3px}
.rm-done li{border-left:3px solid #4caf50}.rm-progress li{border-left:3px solid #ffb300}
.rm-todo li{border-left:3px solid #8a8f99}.rm-future li{border-left:3px solid #9c6bff}
.rm-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body class="ac-page" data-page="roadmap" data-acct-lock="mod">
<header class="ac-bar">
  <div class="acct" data-acct><a class="acct-chip is-guest" href="../profile/"><span class="acct-avw"><span class="acct-av is-guest" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="12.5" r="6"/><path d="M4.5 29c1.6-6.2 6.2-9.4 11.5-9.4S25.9 22.8 27.5 29z"/></svg></span></span><span class="acct-txt"><span class="acct-name">Guest</span><span class="acct-sub">Not signed in</span></span></a></div>
  <a class="ac-logo" href="../">SKIBIDI <span>STRIKE</span></a>
  <nav class="ac-links" aria-label="Main"><a href="../games/">Games</a><a href="../devhub/">Dev</a><a href="../">Site</a></nav>
</header>
<main class="ac-main">
  <p><a class="acct-small" href="./" style="color:#9a9ba8">&larr; Dev</a></p>
  <div class="rm-bar"><h1 class="ac-h1" id="rmTitle">Private <span>roadmap</span></h1><button type="button" class="acct-btn ghost sm" id="rmOut" hidden>Forget key</button></div>
  <div id="rmRoot"><p class="pf-empty">Loading...</p></div>
</main>
<footer class="ac-foot">TTVM Studios &middot; <a href="../games/">Games</a> &middot; <a href="../devhub/">Dev</a> &middot; <a href="../">Skibidi Strike</a></footer>
<script src="../js/auth-config.js?v=2"></script>
<script src="../js/acct.js?v=11"></script>
<script src="../js/visit.js?v=1"></script>
<script src="../js/announce.js?v=3" defer></script>
<script>
// Private roadmap: owners + moderators only.
// Gate 1: a verified Google sign-in whose role in data/roles.json is owner or mod (acct.js, data-acct-lock="mod").
// Gate 2 (the real lock): the roadmap itself lives in the PRIVATE repo, never on this public site.
// It loads straight from GitHub with the viewer's own GitHub key (the same key the Chats page uses,
// saved only in this browser). No key with access to the private repo = nothing to show.
(function(){
  var T = TTVM, esc = T.esc;
  var REPO = "idk1234-c/skibidi-strike", FILE = "roadmap/roadmap.json", TOKEN_KEY = "ss_chat_token";
  var root = null, started = false;
  function $(id){ return document.getElementById(id); }
  function keyForm(msg){
    $("rmOut").hidden = true;
    root.innerHTML = '<div class="ac-card rm-key"><h2 class="ac-h2">Paste your GitHub key</h2>' +
      '<p class="acct-small">The roadmap is kept in the studio\'s private repo, so it only opens with a GitHub key that can read it. It\'s the same key as the Chats page and stays in this browser only.</p>' +
      '<form id="rmForm" autocomplete="off"><input class="ac-in" type="password" id="rmTok" placeholder="github_pat_..." spellcheck="false" autocapitalize="off" autocomplete="off">' +
      '<div class="rm-err" id="rmErr" role="alert">' + esc(msg || "") + '</div><button class="acct-btn" type="submit">Open roadmap</button></form></div>';
    $("rmForm").onsubmit = function(e){
      e.preventDefault();
      var t = String($("rmTok").value || "").trim();
      if(!t || /\s/.test(t)){ $("rmErr").textContent = "That doesn't look like a GitHub key."; return; }
      load(t, true);
    };
  }
  function friendly(st){
    if(st === 401) return "GitHub didn't accept that key (wrong or expired). Make a new one and paste it here.";
    if(st === 403) return "GitHub said no (the key can't read the private repo, or too many tries). Try again in a minute.";
    if(st === 404) return "That key can't see the private repo. It needs read access to skibidi-strike.";
    return "Couldn't reach GitHub. Check your connection and try again.";
  }
  function load(tok, fresh){
    root.innerHTML = '<p class="pf-empty">Loading...</p>';
    fetch("https://api.github.com/repos/" + REPO + "/contents/" + FILE + "?ref=main", {
      headers:{"Accept":"application/vnd.github.raw+json","Authorization":"Bearer " + tok,"X-GitHub-Api-Version":"2022-11-28"}, cache:"no-store"
    }).then(function(r){
      if(!r.ok){ var e = new Error("http " + r.status); e.status = r.status; throw e; }
      return r.json();
    }).then(function(data){
      if(fresh) localStorage.setItem(TOKEN_KEY, tok);
      draw(data);
    }, function(err){
      if(!fresh && (err.status === 401 || err.status === 404)) localStorage.removeItem(TOKEN_KEY);
      keyForm(friendly(err.status));
    });
  }
  var CLS = {done:"rm-done", progress:"rm-progress", todo:"rm-todo", future:"rm-future"};
  function draw(data){
    $("rmOut").hidden = false;
    var name = data.game || "Private game";
    document.title = name + " roadmap \u2014 TTVM Studios";
    $("rmTitle").innerHTML = esc(name) + ' <span>roadmap</span>';
    var h = '<p class="rm-meta">Private. Owners and moderators only.' + (data.updated ? ' Updated ' + esc(data.updated) + '.' : '') + '</p>';
    (data.sections || []).forEach(function(s){
      var items = s.items || [];
      h += '<section class="ac-card rm-sec ' + (CLS[s.id] || "") + '"><h2 class="ac-h2">' + esc(s.emoji || "") + ' ' + esc(s.title || s.id) + ' <small>' + items.length + '</small></h2>' +
        (items.length ? '<ul class="rm-list">' + items.map(function(x){
          if(typeof x === "string") x = {name:x};
          return '<li><b>' + esc(x.name) + '</b>' + (x.note ? '<span>' + esc(x.note) + '</span>' : '') + '</li>';
        }).join("") + '</ul>' : '<p class="acct-small">Nothing here yet.</p>') + '</section>';
    });
    root.innerHTML = h;
  }
  T.on(function(){
    if(!T.allowed("mod")) return;
    root = $("rmRoot");
    if(!root || !document.contains(root) || started) return;
    started = true;
    $("rmOut").onclick = function(){ localStorage.removeItem(TOKEN_KEY); keyForm(""); };
    var tok = localStorage.getItem(TOKEN_KEY);
    if(tok) load(tok, false); else keyForm("");
  });
})();
</script>
</body>
</html>
