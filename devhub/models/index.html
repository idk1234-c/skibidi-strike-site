<main class="ac-main">
  <p><a class="acct-small" href="../" style="color:#9a9ba8">&larr; Dev</a></p>
  <h1 class="ac-h1">3D <span>Models</span></h1>
  <p class="ac-lead">Tap a model to look around it. Drag to spin, pinch or scroll to zoom, two fingers to move. Owners and moderators only.</p>
  <div class="md-grid" id="mdGrid"><p class="pf-note">Loading models&hellip;</p></div>

  <div class="md-view" id="mdView" hidden role="dialog" aria-modal="true" aria-labelledby="mdName">
    <div class="md-top">
      <button class="md-ib" type="button" id="mdClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="md-title"><b id="mdName">Model</b><span id="mdBy">Titan TV Man &middot; TTVM Studios</span></div>
      <a class="md-ib" id="mdDl" href="#" download aria-label="Download model file" title="Download .glb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg></a>
    </div>
    <div class="md-stage" id="mdStage"></div>
    <div class="md-err" id="mdErr" hidden></div>
    <div class="md-bot">
      <div class="md-anim" id="mdAnim" hidden>
        <button class="md-tb" type="button" id="mdPlay" aria-label="Play animation"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
        <select id="mdAnimSel" aria-label="Animation"></select>
      </div>
      <div class="md-tools">
        <button class="md-tb on" type="button" id="mdSpin" aria-pressed="true" title="Auto spin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg><span>Spin</span></button>
        <div class="md-seg" role="group" aria-label="Background">
          <button type="button" data-look="dark" class="on">Dark</button><button type="button" data-look="light">Light</button><button type="button" data-look="studio">Studio</button>
        </div>
        <button class="md-tb" type="button" id="mdReset" title="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span>Reset</span></button>
        <button class="md-tb" type="button" id="mdFull" title="Fullscreen" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Full</span></button>

    </div>
