<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visitors — TTVM Studios</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../acct.css?v=9">
<style>
.vs-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.vs-pill{background:var(--ac-panel);border:1px solid var(--ac-line);color:var(--ac-txt);border-radius:999px;padding:8px 14px;font:600 14px var(--ac-ui);letter-spacing:.04em;cursor:pointer}
.vs-pill.on{background:var(--ac-red);border-color:var(--ac-red);color:#fff}
.vs-chk{display:flex;align-items:center;gap:6px;color:var(--ac-dim);font-size:13px;margin-left:auto}
.vs-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.vs-tile{background:var(--ac-panel);border:1px solid var(--ac-line);border-radius:12px;padding:14px}
.vs-tile b{display:block;font:600 30px/1.1 var(--ac-ui);color:#fff}
.vs-tile span{color:var(--ac-dim);font-size:13px}
.vs-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs-grid .ac-card{margin:0;min-width:0;overflow-x:auto}
.vs-t td:first-child{white-space:nowrap}
.vs-dev{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--ac-bg2);margin:8px 0}
.vs-dev i{display:block;height:100%}
.vs-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ac-dim)}
.vs-leg em{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.vs-t{width:100%;border-collapse:collapse;font-size:14px}
.vs-t th,.vs-t td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--ac-line)}
.vs-t th{color:var(--ac-dim);font-weight:500;font-size:12px}
.vs-t td.n,.vs-t th.n{text-align:right;white-space:nowrap}
.vs-list{list-style:none;margin:0;padding:0}
.vs-list li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--ac-line);font-size:14px}
.vs-list li span:last-child{color:var(--ac-dim);white-space:nowrap}
.vs-rec{list-style:none;margin:0;padding:0}
.vs-rec li{padding:10px 0;border-bottom:1px solid var(--ac-line);font-size:14px;line-height:1.45}
.vs-rec .who{font-weight:600;color:#fff}
.vs-rec .meta,.vs-rec .pg{color:var(--ac-dim);font-size:13px}
.vs-rec .pl{font-size:13px}
.vs-ok{color:var(--ac-green)}.vs-bad{color:var(--ac-red)}.vs-mid{color:var(--ac-gold)}
.vs-days{display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:8px}
.vs-days div{flex:1;background:var(--ac-blue);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.vs-note{color:var(--ac-dim);font-size:13px;margin:8px 0 0}
.vs-staff{font-size:11px;color:var(--ac-gold);border:1px solid var(--ac-gold);border-radius:4px;padding:0 4px;margin-left:4px}
@media (max-width:720px){.vs-t{font-size:13px}.vs-t th,.vs-t td{padding:6px 3px}.vs-tiles{grid-template-columns:1fr 1fr}.vs-grid{grid-template-columns:1fr}.vs-tile b{font-size:26px}.vs-chk{margin-left:0;width:100%}}
</style>
</head>
<body class="ac-page" data-page="visitors" data-acct-lock="owner">
<header class="ac-bar">
  <div class="acct" data-acct><a class="acct-chip is-guest" href="../profile/"><span class="acct-avw"><span class="acct-av is-guest" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="12.5" r="6"/><path d="M4.5 29c1.6-6.2 6.2-9.4 11.5-9.4S25.9 22.8 27.5 29z"/></svg></span></span><span class="acct-txt"><span class="acct-name">Guest</span><span class="acct-sub">Not signed in</span></span></a></div>
  <a class="ac-logo" href="../">SKIBIDI <span>STRIKE</span></a>
  <nav class="ac-links" aria-label="Main"><a href="../games/">Games</a><a href="../devhub/" aria-current="page">Dev</a><a href="../">Site</a></nav>
</header>
<main class="ac-main">
  <h1 class="ac-h1">Visitors</h1>
  <p class="ac-lead">Everyone who opens the site, guests too: what they use, where they came from and what they play. Owner only.</p>
  <div class="vs-bar">
    <button class="vs-pill" data-r="today" type="button">Today</button>
    <button class="vs-pill on" data-r="7d" type="button">7 days</button>
    <button class="vs-pill" data-r="all" type="button">All time</button>
    <button class="vs-pill" id="vsReload" type="button" aria-label="Refresh">&#x21bb;</button>
    <label class="vs-chk"><input type="checkbox" id="vsStaff"> Include studio visits (you + staff)</label>
  </div>
  <div id="vsBody"><p class="pf-note">Loading the numbers&hellip;</p></div>
</main>
<footer class="ac-foot">TTVM Studios &middot; <a href="../games/">Games</a> &middot; <a href="../devhub/">Dev</a> &middot; <a href="../">Skibidi Strike</a></footer>
<script src="../js/auth-config.js?v=2"></script>
<script src="../js/acct.js?v=11"></script>
<script src="../js/visit.js?v=1"></script>
<script src="visitors.js?v=1"></script>
</body>
</html>
